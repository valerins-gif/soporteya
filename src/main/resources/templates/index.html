<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>SoporteYa · Mesa de ayuda</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">
  <link rel="stylesheet" th:href="@{/css/soporteya.css}">
</head>
<body>
  <header class="portada py-5">
    <div class="container">
      <p class="text-uppercase small mb-2">Mesa de ayuda de TI</p>
      <h1 class="display-5 fw-bold">SoporteYa</h1>
      <p class="lead mb-0">Reporte la falla, siga su ticket y sepa quién lo está atendiendo.</p>
    </div>
  </header>
  <main class="container my-5">
    <div class="row g-3">
      <div class="col-md-4"><div class="card card-body h-100"><h2 class="h5">Solicitantes</h2><p class="mb-0">Crean tickets y siguen su estado.</p></div></div>
      <div class="col-md-4"><div class="card card-body h-100"><h2 class="h5">Técnicos</h2><p class="mb-0">Toman los tickets de su especialidad y los resuelven.</p></div></div>
      <div class="col-md-4"><div class="card card-body h-100"><h2 class="h5">Coordinación</h2><p class="mb-0">Administra categorías y usuarios, y mide los tiempos.</p></div></div>
    </div>
  </main>
</body>
</html>
