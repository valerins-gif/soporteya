<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragmentos :: head('Categoría')}"></head>
<body>
  <nav th:replace="~{fragmentos :: menu('categorias')}"></nav>

  <main class="container hoja my-4">
    <h1 class="h3 mb-4" th:text="${categoria.esNuevo()} ? 'Nueva categoría' : 'Editar categoría'">Nueva categoría</h1>

    <form th:action="@{/admin/categorias}" th:object="${categoria}" method="post" novalidate class="card card-body shadow-sm">
      <input type="hidden" th:field="*{id}">
      <div class="mb-3">
        <label for="nombre" class="form-label">Nombre</label>
        <input type="text" th:field="*{nombre}" class="form-control" th:errorclass="is-invalid">
        <div class="invalid-feedback" th:errors="*{nombre}">Error</div>
      </div>
      <div class="mb-3">
        <label for="descripcion" class="form-label">Descripción</label>
        <textarea th:field="*{descripcion}" rows="2" class="form-control" th:errorclass="is-invalid"></textarea>
        <div class="invalid-feedback" th:errors="*{descripcion}">Error</div>
      </div>
      <div class="d-flex gap-2">
        <button type="submit" class="btn btn-primary">Guardar</button>
        <a class="btn btn-outline-secondary" th:href="@{/admin/categorias}">Cancelar</a>
      </div>
    </form>
  </main>

  <th:block th:replace="~{fragmentos :: pie}"></th:block>
</body>
</html>
