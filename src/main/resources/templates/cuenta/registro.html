<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragmentos :: head('Registro')}"></head>
<body>
  <nav th:replace="~{fragmentos :: menu('registro')}"></nav>

  <main class="container my-5" style="max-width: 560px">
    <h1 class="h3 mb-1">Crear una cuenta</h1>
    <p class="text-muted mb-4">Para funcionarios de la empresa. Use su correo corporativo.</p>

    <form th:action="@{/registro}" th:object="${registro}" method="post" novalidate class="card card-body shadow-sm">
      <div class="mb-3">
        <label for="nombreCompleto" class="form-label">Nombre completo</label>
        <input type="text" th:field="*{nombreCompleto}" class="form-control" th:errorclass="is-invalid">
        <div class="invalid-feedback" th:errors="*{nombreCompleto}">Error</div>
      </div>
      <div class="mb-3">
        <label for="email" class="form-label">Correo corporativo</label>
        <input type="email" th:field="*{email}" class="form-control" th:errorclass="is-invalid" autocomplete="username">
        <div class="invalid-feedback" th:errors="*{email}">Error</div>
      </div>
      <div class="mb-3">
        <label for="areaId" class="form-label">Área</label>
        <select th:field="*{areaId}" class="form-select" th:errorclass="is-invalid">
          <option value="">Elija su área…</option>
          <option th:each="a : ${areas}" th:value="${a.id}" th:text="${a.texto}">Contabilidad</option>
        </select>
        <div class="invalid-feedback" th:errors="*{areaId}">Error</div>
      </div>
      <div class="row">
        <div class="col-md-6 mb-3">
          <label for="password" class="form-label">Contraseña</label>
          <input type="password" th:field="*{password}" class="form-control" th:errorclass="is-invalid" autocomplete="new-password">
          <div class="invalid-feedback" th:errors="*{password}">Error</div>
        </div>
        <div class="col-md-6 mb-3">
          <label for="confirmacion" class="form-label">Repítala</label>
          <input type="password" th:field="*{confirmacion}" class="form-control" th:errorclass="is-invalid" autocomplete="new-password">
          <div class="invalid-feedback" th:errors="*{confirmacion}">Error</div>
        </div>
      </div>
      <div class="form-text mb-3">
        Sus datos se tratan según la Ley 1581 de 2012 y solo se usan para atender sus solicitudes de soporte.
      </div>
      <button type="submit" class="btn btn-primary">Crear cuenta</button>
    </form>
  </main>

  <th:block th:replace="~{fragmentos :: pie}"></th:block>
</body>
</html>
