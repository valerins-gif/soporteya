<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragmentos :: head('Ingresar')}"></head>
<body>
  <nav th:replace="~{fragmentos :: menu('login')}"></nav>

  <main class="container my-5" style="max-width: 420px">
    <h1 class="h3 mb-4 text-center">Ingresar a SoporteYa</h1>
    <div th:replace="~{fragmentos :: mensajes}"></div>

    <!-- Spring Security agrega ?error o ?salio a la dirección -->
    <div class="alert alert-danger" th:if="${param.error}">Correo o contraseña incorrectos, o la cuenta está desactivada.</div>
    <div class="alert alert-info" th:if="${param.salio}">Cerró sesión. ¡Hasta pronto!</div>

    <!-- POST /login lo procesa Spring Security. th:action agrega el código CSRF oculto. -->
    <form th:action="@{/login}" method="post" class="card card-body shadow-sm">
      <div class="mb-3">
        <label for="email" class="form-label">Correo</label>
        <input type="email" id="email" name="email" class="form-control" autocomplete="username" required autofocus>
      </div>
      <div class="mb-3">
        <label for="password" class="form-label">Contraseña</label>
        <input type="password" id="password" name="password" class="form-control" autocomplete="current-password" required>
      </div>
      <button type="submit" class="btn btn-primary w-100">Ingresar</button>
    </form>
    <p class="text-center mt-3">¿No tiene cuenta? <a th:href="@{/registro}">Regístrese</a></p>
  </main>

  <th:block th:replace="~{fragmentos :: pie}"></th:block>
</body>
</html>
