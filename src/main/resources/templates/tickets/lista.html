<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragmentos :: head('Mis tickets')}"></head>
<body>
  <nav th:replace="~{fragmentos :: menu('tickets')}"></nav>

  <main class="container my-4">
    <div th:replace="~{fragmentos :: mensajes}"></div>

    <div class="d-flex justify-content-between align-items-center mb-3">
      <h1 class="h3 mb-0">Mis tickets</h1>
      <a class="btn btn-primary" th:href="@{/tickets/nuevo}">Nuevo ticket</a>
    </div>

    <p th:if="${pagina.totalElements == 0}" class="text-muted">Todavía no ha reportado fallas.</p>

    <div class="list-group" th:unless="${pagina.totalElements == 0}">
      <a class="list-group-item list-group-item-action" th:each="t : ${pagina.content}"
         th:href="@{/tickets/{id}(id=${t.id})}">
        <div class="d-flex flex-wrap justify-content-between gap-2">
          <div>
            <span class="text-muted small" th:text="${t.codigo}">SY-00001</span>
            <div class="fw-semibold" th:text="${t.asunto}">El computador no enciende</div>
            <small class="text-muted" th:text="|${t.categoria} · ${t.tecnico ?: 'Sin técnico asignado'}|">Hardware</small>
          </div>
          <div class="text-end">
            <span th:replace="~{fragmentos :: estado(${t.estado})}"></span>
            <span th:replace="~{fragmentos :: prioridad(${t.prioridad})}"></span>
            <div class="small mt-1" th:classappend="${t.vencido} ? 'text-danger fw-semibold' : 'text-muted'"
                 th:text="'Límite: ' + ${#temporals.format(t.fechaLimite, 'd MMM, h:mm a')}">Límite</div>
          </div>
        </div>
      </a>
    </div>

    <nav class="mt-4" th:if="${pagina.totalPages > 1}" aria-label="Páginas">
      <ul class="pagination justify-content-center">
        <li class="page-item" th:classappend="${pagina.first} ? 'disabled'">
          <a class="page-link" th:href="@{/tickets(pagina=${pagina.number - 1})}">Anterior</a>
        </li>
        <li class="page-item" th:each="i : ${#numbers.sequence(0, pagina.totalPages - 1)}"
            th:classappend="${i == pagina.number} ? 'active'">
          <a class="page-link" th:href="@{/tickets(pagina=${i})}" th:text="${i + 1}">1</a>
        </li>
        <li class="page-item" th:classappend="${pagina.last} ? 'disabled'">
          <a class="page-link" th:href="@{/tickets(pagina=${pagina.number + 1})}">Siguiente</a>
        </li>
      </ul>
    </nav>
  </main>

  <th:block th:replace="~{fragmentos :: pie}"></th:block>
</body>
</html>
