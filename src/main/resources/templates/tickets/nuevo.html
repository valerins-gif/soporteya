<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragmentos :: head('Nuevo ticket')}"></head>
<body>
  <nav th:replace="~{fragmentos :: menu('tickets')}"></nav>

  <main class="container hoja my-4">
    <h1 class="h3 mb-4">Reportar una falla</h1>

    <form th:action="@{/tickets}" th:object="${ticket}" method="post" novalidate class="card card-body shadow-sm">
      <div class="alert alert-danger" th:if="${#fields.hasGlobalErrors()}">
        <p class="mb-0" th:each="e : ${#fields.globalErrors()}" th:text="${e}">Error</p>
      </div>

      <div class="mb-3">
        <label for="asunto" class="form-label">Asunto</label>
        <input type="text" th:field="*{asunto}" class="form-control" th:errorclass="is-invalid"
               placeholder="Ej.: El computador no enciende">
        <div class="invalid-feedback" th:errors="*{asunto}">Error</div>
      </div>

      <div class="row">
        <div class="col-md-7 mb-3">
          <label for="categoriaId" class="form-label">Categoría</label>
          <select th:field="*{categoriaId}" class="form-select" th:errorclass="is-invalid">
            <option value="">Elija la categoría…</option>
            <option th:each="c : ${categorias}" th:value="${c.id}" th:text="${c.texto}">Hardware</option>
          </select>
          <div class="invalid-feedback" th:errors="*{categoriaId}">Error</div>
        </div>
        <div class="col-md-5 mb-3">
          <label for="prioridad" class="form-label">Prioridad</label>
          <select th:field="*{prioridad}" class="form-select" th:errorclass="is-invalid">
            <option th:each="p : ${prioridades}" th:value="${p}"
                    th:text="|${p.etiqueta} · hasta ${p.horasLimite} h|">Media · hasta 24 h</option>
          </select>
          <div class="invalid-feedback" th:errors="*{prioridad}">Error</div>
        </div>
      </div>

      <div class="mb-3">
        <label for="descripcion" class="form-label">Descripción</label>
        <textarea th:field="*{descripcion}" rows="5" class="form-control" th:errorclass="is-invalid"
                  placeholder="¿Qué pasa? ¿Desde cuándo? ¿Qué mensaje aparece?"></textarea>
        <div class="invalid-feedback" th:errors="*{descripcion}">Error</div>
      </div>

      <div class="d-flex gap-2">
        <button type="submit" class="btn btn-primary">Crear ticket</button>
        <a class="btn btn-outline-secondary" th:href="@{/tickets}">Cancelar</a>
      </div>
    </form>
  </main>

  <th:block th:replace="~{fragmentos :: pie}"></th:block>
</body>
</html>
