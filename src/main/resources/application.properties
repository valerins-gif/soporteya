spring.application.name=soporteya
spring.thymeleaf.cache=false

# PostgreSQL. La contraseña NO se escribe aquí: llega por la variable DB_PASSWORD
spring.datasource.url=jdbc:postgresql://localhost:5432/soporteya
spring.datasource.username=adso
spring.datasource.password=${DB_PASSWORD}

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.open-in-view=false

# Unidad 2 · idioma fijo: fechas y mensajes en español de Colombia
spring.web.locale=es_CO
spring.web.locale-resolver=fixed

# Unidad 3 · solo los correos de la empresa pueden registrarse
soporteya.dominio-correo=soporteya.co
# La sesión expira tras 30 minutos sin actividad
server.servlet.session.timeout=30m