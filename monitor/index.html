<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Pantalla de la mesa de ayuda</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">
  <style>
    body { background: #1d3557; color: #fff; min-height: 100vh; }
    .cifra { font-size: 5rem; font-weight: 800; line-height: 1; }
    .vencido { color: #ffb4a2; }
  </style>
</head>
<body>
  <!-- Otra aplicación, en OTRO origen (Live Server, puerto 5500), que usa la API de SoporteYa con un token -->
  <main class="container py-5">
    <h1 class="h3 mb-4">Mesa de ayuda · pantalla de la oficina de TI</h1>

    <form id="ingreso" class="row g-2 mb-4" style="max-width: 720px">
      <div class="col-md-5"><input id="email" type="email" class="form-control" placeholder="Correo" value="laura.gomez@soporteya.co" required></div>
      <div class="col-md-4"><input id="password" type="password" class="form-control" placeholder="Contraseña" required></div>
      <div class="col-md-3"><button class="btn btn-warning w-100">Conectar</button></div>
    </form>
    <p id="mensaje" class="text-warning" aria-live="polite"></p>

    <section id="panel" hidden>
      <div class="row text-center mb-4">
        <div class="col"><div class="cifra" id="abiertos">0</div>abiertos</div>
        <div class="col"><div class="cifra" id="enCurso">0</div>en curso</div>
        <div class="col"><div class="cifra vencido" id="vencidos">0</div>vencidos</div>
      </div>
      <ol id="lista" class="list-group list-group-numbered"></ol>
    </section>
  </main>
  <script src="monitor.js"></script>
</body>
</html>
